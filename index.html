<!DOCTYPE html>
<html lang="th">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="description" content="สุขสันต์วันเกิด จากลูกแก้วและสตางค์">
	<title>Happy Birthday | ปู่ใหญ่</title>

	<!-- Fonts -->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Great+Vibes&family=Chakra+Petch:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet">

	<!-- Libraries -->
	<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/TextPlugin.min.js"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

	<link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
	<link rel="stylesheet" href="style.css">
</head>

<body>
	<div class="ambient-bg">
		<div class="cursor-light"></div>
		<div class="orb orb-1"></div>
		<div class="orb orb-2"></div>
		<div class="orb orb-3"></div>
		<div class="particles" id="particles-container"></div>
	</div>

	<div id="loader">
		<div class="loader-content">
			<h1 class="reveal-text">Loading...</h1>
			<div class="progress-bar">
				<div class="progress"></div>
			</div>
		</div>
	</div>

	<main class="main-container">
		<div id="card-wrapper">
			<div id="card">
				<div id="card-inside">
					<div class="wrap">
						<div class="inside-content">
							<p class="wish-title">สุขสันต์วันเกิด</p>
							<div class="wish-text" id="typing-container">
								<p class="typing-line" id="line-1"></p>
								<p class="typing-line" id="line-2"></p>
								<p class="typing-line" id="line-3"></p>
							</div>
							<p class="signed">จาก <br><span class="name" id="signature">ลูกแก้ว และ สตางค์</span> <span class="heart-icon" id="heart-trigger">❤</span></p>
						</div>
					</div>
					<div class="scroll-hint" aria-hidden="true">↓</div>
				</div>

				<div id="card-front">
					<div class="wrap">
						<div class="front-content">
							<h1 class="main-title">Happy <br> Birthday <br></h1>
							<div class="cake-container">
								<div class="glass-cake">
									<div class="candle">
										<div class="flame"></div>
									</div>
									<div class="cake-base"></div>
								</div>
							</div>
						</div>
					</div>

					<div class="card-front_inside">
						<div class="polaroid-wrapper">
							<div class="polaroid">
								<div class="img-frame"></div>
								<div class="polaroid-caption">ปู่รักหลานเสมอ</div>
							</div>
						</div>
						<div class="card-overlay"></div>
					</div>
				</div>
			</div>
			<div class="card-controls">
				<button id="open" class="btn-interact" aria-controls="card-inside" aria-expanded="false">เปิดการ์ด</button>
				<button id="close" class="btn-interact" aria-controls="card-inside">ปิดการ์ด</button>
			</div>
		</div>

	</main>

	<audio id="bg-music" loop preload="auto">
		<source src="./sub_clair-happy-birthday-578363.mp3" type="audio/mpeg">
	</audio>

	<script src="index.js"></script>
</body>

</html>
